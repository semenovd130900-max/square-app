<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Плейлист</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .player-card { background: #1e293b; padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 85%; max-width: 340px; }
        .cover-box { width: 200px; height: 200px; margin: 0 auto 20px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); background: #334155; display: flex; align-items: center; justify-content: center; }
        .no-cover { font-size: 60px; }
        h2 { margin: 10px 0 5px; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        p { margin: 0 0 20px; color: #94a3b8; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-block { margin-bottom: 15px; }
        .progress-container { width: 100%; background: #475569; height: 6px; border-radius: 10px; cursor: pointer; position: relative; }
        .progress { background: #0077ff; width: 0%; height: 100%; border-radius: 10px; }
        .time-box { display: flex; justify-content: space-between; font-size: 12px; color: #94a3b8; margin-top: 5px; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .btn { background: #334155; border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn:active { background: #475569; transform: scale(0.95); }
        .btn-main { background: #0077ff; width: 55px; height: 55px; font-size: 22px; }
        .btn-main:active { background: #0055cc; }
        .btn-active { background: #0077ff; color: white; }
        #trackCount { font-size: 11px; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="cover-box" id="coverBox"><span class="no-cover">🎵</span></div>
    <h2 id="title">Загрузка...</h2>
    <p id="artist">Пожалуйста, подождите</p>

    <div class="progress-block">
        <div class="progress-container" onclick="setProgress(event)">
            <div class="progress" id="progress"></div>
        </div>
        <div class="time-box">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="loopBtn" onclick="toggleLoop()">🔁</button>
        <button class="btn" onclick="prevTrack()">⏮</button>
        <button class="btn btn-main" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="btn" onclick="nextTrack()">⏭</button>
    </div>
    <div id="trackCount"></div>
</div>

<audio id="audio" src=""></audio>

<script>
    // Фиксированный плейлист из ваших реальных файлов на GitHub
    const tracks = [
        { 
            title: "Земляк", 
            artist: "Koss, ПЛУТТО", 
            src: "Koss, ПЛУТТО - Земляк.mp3"
        },
        { 
            title: "Мир", 
            artist: "MIRAVI feat. Гио Пика", 
            src: "miravi-feat.-gio-pika-mir (1).mp3"
        }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;
    let isLooping = false;

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const loopBtn = document.getElementById('loopBtn');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progress = document.getElementById('progress');
    const coverBox = document.getElementById('coverBox');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const trackCountEl = document.getElementById('trackCount');

    function loadTrack(track) {
        if (!track) return;
        title.innerText = track.title;
        artist.innerText = track.artist;
        // Безопасное кодирование пробелов в ссылке для iPhone
        audio.src = encodeURIComponent(track.src).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
        coverBox.innerHTML = `<span class="no-cover">🎵</span>`;
    }

    function updateTrackCount() {
        if (tracks.length > 0) {
            trackCountEl.innerText = `Трек ${currentTrackIndex + 1} из ${tracks.length}`;
        }
    }

    function togglePlay() {
        if (tracks.length === 0) return;
        if (isPlaying) { pauseTrack(); } else { playTrack(); }
    }

    function playTrack() {
        isPlaying = true;
        playBtn.innerText = "⏸";
        audio.play().catch(e => console.log("Плеер ожидает клика пользователя"));
    }

    function pauseTrack() {
        isPlaying = false;
        playBtn.innerText = "▶";
        audio.pause();
    }

    function prevTrack() {
        if (tracks.length <= 1) return;
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        loadTrack(tracks[currentTrackIndex]);
        updateTrackCount();
        if (isPlaying) playTrack();
    }

    function nextTrack() {
        if (tracks.length <= 1) return;
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(tracks[currentTrackIndex]);
        updateTrackCount();
        if (isPlaying) playTrack();
    }

    function toggleLoop() {
        isLooping = !isLooping;
        audio.loop = isLooping;
        if (isLooping) {
            loopBtn.classList.add('btn-active');
        } else {
            loopBtn.classList.remove('btn-active');
        }
    }

    function formatTime(time) {
        const min = Math.floor(time / 60);
        const sec = Math.floor(time % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;
        const duration = audio.duration || 0;
        
        if (duration) {
            const progressPercent = (currentTime / duration) * 100;
            progress.style.width = `${progressPercent}%`;
            durationEl.innerText = formatTime(duration);
        }
        currentTimeEl.innerText = formatTime(currentTime);
    });

    audio.addEventListener('ended', () => {
        if (!isLooping) nextTrack();
    });

    function setProgress(e) {
        const width = e.currentTarget.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        if (duration) {
            audio.currentTime = (clickX / width) * duration;
        }
    }

    // Загружаем первый трек сразу
    if (tracks.length > 0) {
        loadTrack(tracks[currentTrackIndex]);
        updateTrackCount();
    }
</script>

</body>
</html>
