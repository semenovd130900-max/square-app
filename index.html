<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Web Player 1000+</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .player {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #333;
        }
        .status-badge {
            background: #242444;
            color: #00f2fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid #00f2fe;
        }
        .track-info { margin-bottom: 25px; }
        .track-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #00f2fe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 13px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 25px;
        }
        .btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { color: #00f2fe; }
        .btn-play { font-size: 45px; color: #00f2fe; }
        
        .progress-container {
            background: #333;
            border-radius: 5px;
            cursor: pointer;
            height: 6px;
            width: 100%;
            margin-bottom: 10px;
        }
        .progress {
            background: linear-gradient(to right, #00f2fe, #4facfe);
            border-radius: 5px;
            height: 100%;
            width: 0%;
        }
        .time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-bottom: 20px;
        }
        
        .playlist {
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
            background: #111122;
            border-radius: 10px;
            padding: 10px;
        }
        .playlist-item {
            padding: 8px;
            font-size: 12px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item:hover { color: #00f2fe; }
        .playlist-item.active { color: #00f2fe; font-weight: bold; background: #242444; border-radius: 5px; }
    </style>
</head>
<body>

<div class="player">
    <div class="status-badge" id="status">🌐 Подключение к серверу...</div>

    <div class="track-info">
        <div class="track-title" id="title">Синхронизация...</div>
        <div class="track-artist" id="artist">Поиск музыки в сети</div>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress" id="progress"></div>
    </div>
    <div class="time">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button class="btn" id="prev">⏮</button>
        <button class="btn btn-play" id="play">▶️</button>
        <button class="btn" id="next">⏭</button>
    </div>

    <div class="playlist" id="playlist">
        <div style="color: #555; text-align: center; padding-top: 70px;">Загрузка списка треков...</div>
    </div>
</div>

<script>
    const playBtn = document.getElementById('play');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progress = document.getElementById('progress');
    const progressContainer = document.getElementById('progress-container');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const playlistEl = document.getElementById('playlist');
    const statusBadge = document.getElementById('status');

    const audio = new Audio();
    audio.crossOrigin = "anonymous"; // Разрешаем кроссдоменные стримы данных
    let songs = [];
    let songIndex = 0;
    let isPlaying = false;

    // Автоматическая загрузка 1000 треков через открытый Jamendo API при старте плеера
    async function fetchOnlineTracks() {
        const CLIENT_ID = '5519bb5a'; // Публичный тестовый ключ разработчика Jamendo
        const LIMIT = 1000;
        // Исправленный URL: добавлен корректный эндпоинт ://jamendo.com и интерполяция переменной
        const url = `https://jamendo.com{CLIENT_ID}&format=json&limit=${LIMIT}&order=popularity_desc&include=musicinfo`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            if (data.results && data.results.length > 0) {
                // Преобразуем ответ API в удобный формат для плеера
                songs = data.results.map(track => ({
                    name: track.name,
                    artist: track.artist_name,
                    url: track.audio // Прямая потоковая ссылка на mp3 файл
                }));

                statusBadge.innerText = `✅ Загружено треков: ${songs.length}`;
                renderPlaylist();
                loadSong(songs[songIndex]);
            } else {
                statusBadge.innerText = '❌ Ошибка: Музыка не найдена';
            }
        } catch (error) {
            console.error('Ошибка сети при запросе к API:', error);
            statusBadge.innerText = '❌ Ошибка сети при загрузке';
        }
    }

    function renderPlaylist() {
        playlistEl.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.classList.add('playlist-item');
            if (index === songIndex) item.classList.add('active');
            item.innerText = `${index + 1}. ${song.artist} — ${song.name}`;
            
            item.addEventListener('click', () => {
                songIndex = index;
                loadSong(songs[songIndex]);
                playSong();
            });
            playlistEl.appendChild(item);
        });
    }

    function loadSong(song) {
        if (!song) return;
        title.innerText = song.name;
        artist.innerText = song.artist;
        audio.src = song.url;
        
        const items = document.querySelectorAll('.playlist-item');
        items.forEach((item, index) => {
            if (index === songIndex) item.classList.add('active');
            else item.classList.remove('active');
        });
        
        const activeItem = playlistEl.querySelector('.active');
        if (activeItem) {
            playlistEl.scrollTop = activeItem.offsetTop - playlistEl.offsetTop;
        }
    }

    function playSong() {
        if (songs.length === 0) return;
        isPlaying = true;
        playBtn.innerText = '⏸';
        audio.play().catch(err => console.log("Сбой воспроизведения:", err));
    }

    function togglePlay() {
        if (isPlaying) {
            isPlaying = false;
            playBtn.innerText = '▶️';
            audio.pause();
        } else {
            playSong();
        }
    }

    function prevSong() {
        if (songs.length === 0) return;
        songIndex = (songIndex - 1 + songs.length) % songs.length;
        loadSong(songs[songIndex]);
        if (isPlaying) playSong();
    }

    function nextSong() {
        if (songs.length === 0) return;
        songIndex = (songIndex + 1) % songs.length;
        loadSong(songs[songIndex]);
        if (isPlaying) playSong();
    }

    function updateProgress(e) {
        const { duration, currentTime } = e.srcElement;
        if (!duration) return;
        
        const progressPercent = (currentTime / duration) * 100;
        progress.style.width = `${progressPercent}%`;

        const formatTime = (time) => Math.floor(time / 60) + ':' + String(Math.floor(time % 60)).padStart(2, '0');
        currentTimeEl.innerText = formatTime(currentTime);
        durationEl.innerText = formatTime(duration);
    }

    function setProgress(e) {
        const width = this.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        if (duration) {
            audio.currentTime = (clickX / width) * duration;
        }
    }

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    progressContainer.addEventListener('click', setProgress);

    // Инициализация загрузки из интернета при старте страницы
    fetchOnlineTracks();
</script>

</body>
</html>
